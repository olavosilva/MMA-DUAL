[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-dual"
version = "0.2.0"
description = "MMA and GCMMA subproblems solved by the dual method, with a drop-in interface for mmapy (GCMMA-MMA-Python), for problems with few constraints"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Olavo M. Silva", email = "olavo@lva.ufsc.br"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["method of moving asymptotes", "MMA", "GCMMA", "dual method", "topology optimization", "structural optimization"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["mmapy>=0.3", "scipy", "pytest"]

[project.urls]
Homepage = "https://github.com/olavosilva/MMA-DUAL"
Repository = "https://github.com/olavosilva/MMA-DUAL"
"Derived from" = "https://github.com/arjendeetman/GCMMA-MMA-Python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LinAlgWarning is raised by scipy.linalg.solve inside mmapy's interior-point routine on the degenerate reference
# runs of tests/test_against_mmapy.py and tests/test_edge_cases.py (not by mmadual); it is listed here so that
# the summary stays readable, not hidden: run pytest -W default::scipy.linalg.LinAlgWarning to see them
filterwarnings = ["ignore::scipy.linalg.LinAlgWarning"]
